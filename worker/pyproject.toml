[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientist-worker"
version = "0.8.3"
description = "Scientist Lab remote GPU worker API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "docker>=7.0.0",
]

[project.scripts]
scientist-worker = "scientist_worker.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scientist_worker*"]
