[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientist-lab"
version = "2.3.0"
description = "Local-first, human-approval AI Scientist workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "docker>=7.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "sqlalchemy>=2.0.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0.0",
  "jsonschema>=4.20.0",
  "referencing>=0.35.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
scientist-lab = "scientist_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "worker"]
